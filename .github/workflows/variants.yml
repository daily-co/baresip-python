name: variants

# The supported build variants, each compiled with its real module list and
# then audited and tested — so none of them can rot silently. Scheduled
# nightly plus any PR that touches the build inputs; not per push, where
# three extra native builds would buy little signal for the cost.
on:
  schedule:
    - cron: "14 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_native.py"
      - "src/_native/**"
      - "Makefile"
      - "pyproject.toml"
      - "third_party/**"
      - ".github/workflows/variants.yml"

env:
  PYTHONFAULTHANDLER: 1

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default distributed module set — the baseline the other
          # variants are measured against.
          - variant: default
          # The supported opt-in modules: compile, audit linkage, run the
          # unit suite. Behavioral coverage needs the telephony bench and
          # lives outside CI.
          - variant: optin
            extra_apt: libsndfile1-dev
            extra_modules: sndfile;in_band_dtmf
            extra_libs: -lsndfile
          # Interactive/debug modules compiled in; the assertion is that
          # the production runtime still never activates them.
          - variant: debug-modules
            native_flags: --debug-modules
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev libasound2-dev ${{ matrix.extra_apt }}
      - run: uv sync --group dev
      - run: uv run python scripts/build_native.py ${{ matrix.native_flags }}
        env:
          BARESIP_EXTRA_MODULES: ${{ matrix.extra_modules }}
      - run: make ext
        env:
          BP_EXTRA_LIBS: ${{ matrix.extra_libs }}
      - run: make test
      - run: make check
      - run: uv run pytest tests/variants
        if: matrix.variant == 'debug-modules'
