# The integration suite against the FreeSWITCH bench (bench/README.md):
# registration, calls in both directions, hold, transfer, DTMF, TLS and
# video through a real switch. Runs on the runner itself, not in a job
# container: the tests reach the bench on 127.0.0.1 and drive its
# container through docker.
name: bench

on:
  workflow_dispatch:

env:
  PYTHONFAULTHANDLER: 1

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev libvpx-dev libv4l-dev libasound2-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext
      - run: make bench-up
      - run: uv run pytest tests/integration -m bench -v --log-level=DEBUG
      - name: Collect FreeSWITCH logs
        if: failure()
        run: |
          mkdir -p build/bench-logs
          docker ps -a > build/bench-logs/containers.txt 2>&1 || true
          docker logs baresip-bench-freeswitch > build/bench-logs/container.log 2>&1 || true
          docker cp baresip-bench-freeswitch:/var/log/freeswitch/freeswitch.log build/bench-logs/ || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bench-logs
          path: build/bench-logs
      - run: make bench-down
        if: always()
