name: ci

on:
  push:
  workflow_dispatch:

env:
  # A native crash prints the Python-side tracebacks instead of a bare
  # "Segmentation fault" — for every python invocation, not just pytest
  # (which enables faulthandler itself).
  PYTHONFAULTHANDLER: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext
      - run: make test
      - run: make check

  # The unit suite again, under an ASan+UBSan-instrumented extension with
  # leak detection: memory errors in the C sources do not announce
  # themselves in ordinary runs.
  #
  # Runs inside the python:3.12 container rather than on the runner's
  # Python: the LSan suppressions name CPython's internal allocator
  # symbols (_PyMem_Raw*, _PyObject_*), which only symbolize against an
  # unstripped interpreter. Ubuntu's /usr/bin/python3.12 is stripped, so
  # interpreter-noise leaks go unmatched and the lane fails on false
  # positives. The Docker library image ships full symbols.
  sanitize:
    runs-on: ubuntu-latest
    container: python:3.12
    env:
      # The venv must be built from the container's unstripped
      # interpreter, never a downloaded (stripped) managed build.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential cmake libssl-dev libopus-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext-san
      - run: make test-san

  # macOS runs on manual dispatch only: local development already covers it
  # daily, and macOS runners bill at 10x Linux. Move it to the push trigger
  # when that trade-off changes.
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: brew install opus openssl@3
      - run: uv sync --group dev
      - run: make native
      - run: make ext
      - run: make test
      - run: make check
