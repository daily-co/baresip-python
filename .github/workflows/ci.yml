name: ci

on:
  push:
  workflow_dispatch:

env:
  # A native crash prints the Python-side tracebacks instead of a bare
  # "Segmentation fault" — for every python invocation, not just pytest
  # (which enables faulthandler itself).
  PYTHONFAULTHANDLER: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev libvpx-dev libv4l-dev libasound2-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext
      - run: make test
      # The torture suite at a tenth of its nightly iteration counts —
      # enough to catch a gross regression on every push; torture.yml
      # runs it full-scale.
      - name: Torture (lite)
        run: TORTURE_SCALE=0.1 uv run pytest tests/torture -m torture
      - run: make check

  # Coverage of the Python package and the C sources by the unit suite,
  # held against tests/coverage-baseline.json: a change may not lower it.
  # Its own job and its own build, because the extension is instrumented
  # for gcov and nothing else should be tested against that.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev libvpx-dev libv4l-dev libasound2-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext-cov cov-clean cov-unit
      - name: Report
        id: report
        run: make cov-report
        continue-on-error: true
      - name: Add the report to the run's summary
        run: cat build/coverage/report.md >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, replaced on every push.
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || exit 0
          old=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- coverage-report -->")) | .id' | head -1)
          if [ -n "$old" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$old" -F body=@build/coverage/report.md > /dev/null
          else
            gh pr comment "$pr" --body-file build/coverage/report.md
          fi
      - name: Fail when coverage dropped
        if: steps.report.outcome == 'failure'
        run: exit 1

  # The unit suite again, under an ASan+UBSan-instrumented extension with
  # leak detection: memory errors in the C sources do not announce
  # themselves in ordinary runs.
  #
  # Runs inside the python:3.12 container rather than on the runner's
  # Python: the LSan suppressions name CPython's internal allocator
  # symbols (_PyMem_Raw*, _PyObject_*), which only symbolize against an
  # unstripped interpreter. Ubuntu's /usr/bin/python3.12 is stripped, so
  # interpreter-noise leaks go unmatched and the lane fails on false
  # positives. The Docker library image ships full symbols.
  sanitize:
    runs-on: ubuntu-latest
    container: python:3.12
    env:
      # The venv must be built from the container's unstripped
      # interpreter, never a downloaded (stripped) managed build.
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential cmake libssl-dev libopus-dev libvpx-dev libv4l-dev libasound2-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext-san
      - run: make test-san

  # The thread-boundary test scope under ThreadSanitizer. TSan and ASan
  # are mutually exclusive, so this is its own build and job; same
  # container rationale as sanitize.
  tsan:
    runs-on: ubuntu-latest
    # Privileged for the sysctl below, which is host-wide.
    container:
      image: python:3.12
      options: --privileged
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      # TSan maps its shadow memory at fixed addresses and aborts at startup
      # ("unexpected memory mapping") when the kernel's mmap randomization
      # spans them; 28 bits is the widest range it accepts.
      - run: sysctl -w vm.mmap_rnd_bits=28
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential cmake libssl-dev libopus-dev libvpx-dev libv4l-dev libasound2-dev
      - run: uv sync --group dev
      - run: make native
      - run: make ext-tsan
      - run: make test-tsan

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install native build dependencies
        run: brew install opus openssl@3 libvpx
      - run: uv sync --group dev
      - run: make native
      - run: make ext
      - run: make test
      - run: make check
