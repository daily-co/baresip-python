# Local FreeSWITCH bench for integration tests and manual poking.
#
# Everything binds to 127.0.0.1 only, and the credentials are throwaway
# (see README.md) — this stack must never face a network.
#
# The image has no arm64 build; the explicit platform makes Docker Desktop
# run it under emulation on Apple Silicon and natively on amd64 CI.

services:
  freeswitch:
    image: safarov/freeswitch:1.10.12
    platform: linux/amd64
    container_name: baresip-bench-freeswitch
    volumes:
      - ./conf/freeswitch.xml:/etc/freeswitch/freeswitch.xml:ro
      # Self-signed TLS material, generated by `make bench-up` (gitignored).
      - ./certs:/etc/freeswitch/tls:ro
    ports:
      # Non-default SIP port so the bench never collides with a real SIP
      # agent on the machine. Tests read BENCH_SIP_PORT (default 15060).
      # The container-side port matches conf/freeswitch.xml sip-port: the
      # Contact/SDP addresses FS advertises must be dialable from the host,
      # so host and container ports have to agree (overriding BENCH_SIP_PORT
      # breaks that parity — see README).
      - "127.0.0.1:${BENCH_SIP_PORT:-15060}:15060/udp"
      - "127.0.0.1:${BENCH_SIP_PORT:-15060}:15060/tcp"
      # TLS signaling; same parity rule against tls-sip-port.
      - "127.0.0.1:${BENCH_TLS_PORT:-15061}:15061/tcp"
      # RTP: must mirror rtp-start-port/rtp-end-port in conf/freeswitch.xml.
      - "127.0.0.1:16384-16403:16384-16403/udp"
      # The proxy (the kamailio service below shares this network
      # namespace, so its ports are published here). One port per
      # Record-Route form; see conf/kamailio.cfg.
      - "127.0.0.1:15070:15070/udp"
      - "127.0.0.1:15070-15075:15070-15075/tcp"
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 5s

  # A SIP proxy that puts itself on a call's route, which FreeSWITCH (a
  # B2BUA) never does. It shares FreeSWITCH's network namespace: the
  # Record-Route it inserts must be dialable both from the host and from
  # FreeSWITCH, and 127.0.0.1:<port> is that only when the two containers
  # are one host.
  kamailio:
    image: ghcr.io/kamailio/kamailio:6.1.5-bookworm
    container_name: baresip-bench-kamailio
    network_mode: "service:freeswitch"
    depends_on:
      - freeswitch
    volumes:
      - ./conf/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./conf/kamailio-tls.cfg:/etc/kamailio/tls.cfg:ro
      - ./certs:/etc/kamailio/tls:ro
    healthcheck:
      test: ["CMD", "kamcmd", "core.uptime"]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 5s
