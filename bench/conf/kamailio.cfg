#!KAMAILIO
#
# The bench proxy: a registrar and a stateful proxy that Record-Routes,
# for tests of how an endpoint follows the route a proxy gives it.
# Throwaway by design, like the rest of the bench: no authentication,
# loopback only (see README.md).
#
# The port a call enters on picks the Record-Route it gets. Entries are
# listed top first: the answering side takes the first as its next hop,
# the caller the last. The proxy reaches a registered endpoint the way
# it registered; the bench registers answering endpoints over UDP.
#
#   15070 udp/tcp  <sip:127.0.0.1:15070;lr>
#   15071 tls      <sip:127.0.0.1:15070;lr>, <sip:127.0.0.1:15071;transport=tls;lr>
#   15072 tls      <sips:127.0.0.1:15072;lr>
#   15073 tls      <sips:localhost:15073;lr>
#   15075 tls      <sips:localtest.me:15075;lr>, a host the bench certificate does not name
#   15074 tls      <sip:127.0.0.1:15070;lr>, <sips:127.0.0.1:15074;lr>
#
# Calls go to a registered endpoint; the proxy does not relay to
# FreeSWITCH.

debug=2
log_stderror=yes
fork=yes
children=2
enable_tls=yes
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes

listen=udp:0.0.0.0:15070
listen=tcp:0.0.0.0:15070
listen=tls:0.0.0.0:15071
listen=tls:0.0.0.0:15072
listen=tls:0.0.0.0:15073
listen=tls:0.0.0.0:15074
listen=tls:0.0.0.0:15075

# The addresses the Record-Route entries use for this proxy, so that it
# recognises its own entry when a request comes back along the route.
alias="127.0.0.1:15070"
alias="127.0.0.1:15071"
alias="127.0.0.1:15072"
alias="127.0.0.1:15073"
alias="127.0.0.1:15074"
alias="localhost:15073"
alias="127.0.0.1:15075"
alias="localtest.me:15075"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "nathelper.so"
loadmodule "ctl.so"
loadmodule "tls.so"

modparam("tls", "config", "/etc/kamailio/tls.cfg")
modparam("usrloc", "db_mode", 0)
modparam("registrar", "received_avp", "$avp(received)")
modparam("nathelper", "received_avp", "$avp(received)")

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # Endpoints sit behind Docker's forwarder: answer where the request
    # came from, and remember that address as how to reach them.
    force_rport();

    if (is_method("REGISTER")) {
        fix_nated_register();
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    if (!is_method("INVITE")) {
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    set_contact_alias();
    route(RECORD_ROUTE);
    if (!lookup("location")) {
        sl_send_reply("404", "Not Found");
        exit;
    }
    t_on_reply("ANSWER");
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# The Record-Route for the port the call entered on. "r2=on" marks a
# pair of entries as one proxy's, so that loose_route() strips both.
route[RECORD_ROUTE] {
    switch ($Rp) {
        case 15071:
            insert_hf("Record-Route: <sip:127.0.0.1:15070;r2=on;lr>\r\nRecord-Route: <sip:127.0.0.1:15071;transport=tls;r2=on;lr>\r\n");
            break;
        case 15072:
            insert_hf("Record-Route: <sips:127.0.0.1:15072;lr>\r\n");
            break;
        case 15073:
            insert_hf("Record-Route: <sips:localhost:15073;lr>\r\n");
            break;
        case 15074:
            insert_hf("Record-Route: <sip:127.0.0.1:15070;r2=on;lr>\r\nRecord-Route: <sips:127.0.0.1:15074;r2=on;lr>\r\n");
            break;
        case 15075:
            insert_hf("Record-Route: <sips:localtest.me:15075;lr>\r\n");
            break;
        default:
            insert_hf("Record-Route: <sip:127.0.0.1:15070;lr>\r\n");
    }
}

route[WITHINDLG] {
    if (loose_route()) {
        handle_ruri_alias();
        # A request that renews the sender's Contact (a re-INVITE does)
        # must carry the address it is reachable at, and so must its
        # answer: the peer sends everything after to that Contact.
        if (is_method("INVITE|UPDATE|REFER|NOTIFY|SUBSCRIBE")) {
            set_contact_alias();
            t_on_reply("ANSWER");
        }
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }
    if (is_method("ACK")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }
    sl_send_reply("404", "Not Here");
}

onreply_route[ANSWER] {
    if (status =~ "^(18[03]|2[0-9][0-9])$") {
        set_contact_alias();
    }
}
