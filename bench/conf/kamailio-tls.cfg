# TLS for the bench proxy: the bench's self-signed certificate (generated
# by `make bench-up`), no client certificates asked for or checked.
[server:default]
method = TLSv1.2+
private_key = /etc/kamailio/tls/key.pem
certificate = /etc/kamailio/tls/cert.pem
verify_certificate = no
require_certificate = no

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
